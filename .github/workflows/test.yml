name: Test and package

on:
  workflow_call:
    inputs:
      release:
        description: Build and validate release packages
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install native and shell dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libclang-dev libudev-dev pkg-config shellcheck
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features --locked
      - name: Validate shell scripts
        run: |
          bash -n scripts/ci/*.sh packaging/*.sh
          shellcheck scripts/ci/*.sh packaging/*.sh
      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint:1.7.12

  linux-packages:
    if: inputs.release
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libclang-dev libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release --locked
      - name: Install nFPM
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build Debian and RPM packages
        run: scripts/ci/package-linux.sh target/release/action-webcamd amd64 dist
      - name: Test Debian package in clean Ubuntu
        run: scripts/ci/test-linux-package.sh deb dist
      - name: Test RPM package in clean Fedora
        run: scripts/ci/test-linux-package.sh rpm dist
      - name: Create package checksums
        run: (cd dist && sha256sum -- ./*.deb ./*.rpm > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
          if-no-files-found: error

  aur-validation:
    if: inputs.release
    needs: linux-packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Validate source AUR package in clean Arch Linux
        run: scripts/ci/validate-aur.sh
